# electron-builder 配置（NSIS 安装包，Windows x64）
# 关键决策见 DECISIONS 2026-09-22 桌面版条目：
#  - 数据目录在 %APPDATA%\ttFolio，卸载默认**不删数据**（索引库/备份/回收站都在那）
#  - NSIS Unicode 安装器 + 允许改安装目录 → 中文安装路径/中文用户名均可用
#  - better-sqlite3 以 electron ABI 预编译产物分发（asar 外置，native 模块不能进 asar）
appId: com.tttao.ttfolio
productName: TT项目管理工作台
copyright: Copyright © 2026
# 原生依赖由出包链的 electron-rebuild 步骤统一处理：better-sqlite3 重编为 Electron ABI，
# node-pty 为 N-API 预编译二进制（免重建）。关闭 builder 自带的 npm rebuild，
# 否则它会用 node-gyp 重编 node-pty 并因缺构建工具失败。
npmRebuild: false
directories:
  output: dist-electron
  buildResources: electron/build
extraMetadata:
  main: electron/main.cjs
files:
  - electron/**/*
  - app/**/*
  - packages/server/src/migrations/*.sql
  - packages/web/dist/**/*
  - package.json
  - node_modules/better-sqlite3/**/*
  - node_modules/bindings/**/*
  - node_modules/file-uri-to-path/**/*
  - node_modules/node-pty/**/*
asarUnpack:
  - node_modules/better-sqlite3/**/*
  - node_modules/node-pty/**/*
win:
  icon: electron/build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  unicode: true
  artifactName: ttFolio-Setup-${version}.${ext}
  shortcutName: TT项目管理工作台
