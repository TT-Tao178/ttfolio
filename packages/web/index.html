<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ttFolio · TT项目管理工作台</title>
    <script>
      // 运行时注入：生产由 server 响应时替换；dev 由 vite 插件替换（见 vite.config.ts）
      window.__TTFOLIO_TOKEN__ = '%%TTFOLIO_TOKEN%%';
      // 后端端口：用于推导用户内容端口（= 后端端口 + 100）
      window.__TTFOLIO_PORT__ = '%%TTFOLIO_PORT%%';
      // API 基址：'' = 同源（生产同源；dev 走 vite 代理 /api，避免跨源被 CORS/Host 校验拦下）
      window.__TTFOLIO_API_BASE__ = '%%TTFOLIO_API_BASE%%';
      // 用户内容基址（架构图/原始文件，独立端口，C-13）：'' = 由后端端口推导
      window.__TTFOLIO_CONTENT_BASE__ = '%%TTFOLIO_CONTENT_BASE%%';
    </script>
    <style>
      /* 正文基准字号与 AntD 令牌（fontSize: 14）及《界面原型-AntD.html》（body 14px）一致。
         不设的话自绘文字会继承浏览器默认 16px，比 AntD 控件大一号，看起来"字号不统一"。 */
      html,
      body {
        font-size: 14px;
      }
    </style>
    <script>
      // TT-THEME-CACHE：仅缓存主题选择用于首帧渲染，业务数据一律走 API 落库（C-29 例外，见 DECISIONS.md）
      // 首帧兜底：'system' 也要处理（原先只认 'dark'，跟随系统时首帧会闪白）；
      // 真正的深浅变量由 app/settings.tsx 调用 applyThemeVars 写入，这里只保证底色不闪。
      try {
        var t = localStorage.getItem('ttfolio-theme');
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-tt-dark', dark ? '1' : '0');
        document.documentElement.style.background = dark ? '#141414' : '#f5f5f5';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.body.style.background = dark ? '#141414' : '#f5f5f5';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
